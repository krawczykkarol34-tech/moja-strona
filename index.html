```html
<form class="contact-form" id="contactForm" action="https://formspree.io/f/myezygod" method="POST">
  <label>
    Imię / firma
    <input type="text" name="name" placeholder="Jak się nazywasz?" required>
  </label>

  <label>
    E-mail
    <input type="email" name="email" placeholder="twoj@email.pl" required>
  </label>

  <label>
    Wiadomość
    <textarea name="message" rows="5" placeholder="Opisz krótko, czego potrzebujesz..." required></textarea>
  </label>

  <button class="btn btn-primary" type="submit">
    Wyślij zapytanie <span>→</span>
  </button>

  <p class="form-note">Wiadomość zostanie wysłana na adres e-mail właściciela formularza.</p>
  <p class="form-success" aria-live="polite"></p>
</form>
```
